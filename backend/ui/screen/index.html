<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Only our own files: no internet, no outside scripts, no inline code. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <title>J.A.R.V.I.S</title>
  <link rel="stylesheet" href="screen.css">
</head>
<body class="booting">
  <canvas id="backdrop" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">J.A.R.V.I.S</span>
      <span class="brand-sub">Just A Rather Very Intelligent System</span>
    </div>
    <div class="clock">
      <span id="clock-time">00:00:00</span>
      <span id="clock-date">---</span>
    </div>
    <div class="controls">
      <button id="pause-btn" class="hud-btn" type="button">Pause listening</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel panel-left" aria-label="Conversation">
      <h2 class="panel-title"><span>Conversation</span><i></i></h2>
      <ol id="conversation" class="conversation"></ol>
    </section>

    <section class="core" aria-label="Status">
      <canvas id="reactor"></canvas>
      <div class="core-label">
        <div id="status-word" class="status-word">Initialising</div>
        <div id="status-detail" class="status-detail">&nbsp;</div>
      </div>
    </section>

    <section class="panel-stack">
      <div class="panel panel-right" aria-label="Timers">
        <h2 class="panel-title"><span>Timers</span><i></i></h2>
        <ul id="timers" class="timers"></ul>
      </div>
      <div class="panel panel-right" aria-label="Activity">
        <h2 class="panel-title"><span>Activity</span><i></i></h2>
        <ul id="activity" class="activity"></ul>
      </div>
    </section>
  </main>

  <footer class="bottombar">
    <ul id="systems" class="systems"></ul>
    <div id="boot-text" class="boot-text"></div>
  </footer>

  <script src="screen.js"></script>
</body>
</html>
